[project]
name = "agent-bridge"
version = "0.1.0"
description = "Lightweight local stdio MCP server bridging Claude Code to Antigravity (Gemini Neon/etc.) and Codex (GPT) subagents over existing CLI subscriptions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
]

[project.scripts]
agent-bridge = "agent_bridge.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
