[project]
name = "agent-bridge"
version = "0.1.0"
description = "Lightweight local stdio MCP server that lets any AI coding CLI (Claude Code, Codex, Antigravity) run the others as subagents over existing CLI subscriptions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
]

[project.scripts]
agent-bridge = "agent_bridge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bridge"]

[tool.hatch.build.targets.wheel.force-include]
"skills/bridge-usage/SKILL.md" = "agent_bridge/skills/bridge-usage/SKILL.md"
"skills/bridge-routing/SKILL.md" = "agent_bridge/skills/bridge-routing/SKILL.md"
"skills/host-instructions.md" = "agent_bridge/skills/host-instructions.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
